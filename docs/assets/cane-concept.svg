<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Concept of a detachable upper-body obstacle sensing module on a white cane</title>
<desc id="desc">An illustrative module clips below the cane grip. A green fan indicates the proposed sensing direction toward a hanging obstacle. A separate shaft continues to the ground. Geometry and components are conceptual.</desc>
